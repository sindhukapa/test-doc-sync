openapi: 3.0.0
info:
  title: Platform API
  version: Stable
  contact:
    name: ZoomInfo Customer Support
    email: help@zoominfo.com
  description: The platform API
tags:
  - name: search
  - name: enrich
paths:
  /data/v1/companies/enrich:
    post:
      operationId: EnrichInterface_enrichCompany
      description: Returns a list of Companies from ZoomInfo's data that meet the specified enrich criteria.
      parameters: []
      responses:
        '200':
          description: The request completed successfully and the requested data was returned
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CompanyEnrichResponse'
        '400':
          description: The base model for all error responses to be used when specifying the response of an operation.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZoomInfo.Core.Foundations.ErrorResponseModel'
        '404':
          description: The base model for all error responses to be used when specifying the response of an operation.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZoomInfo.Core.Foundations.ErrorResponseModel'
      tags:
        - enrich
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyEnrichRequest'
      security:
        - OAuth2Auth:
            - api:enrich:company
      x-api-roles:
        - fea:zia
        - fea:api
      x-api-role-requirement: ANY_REQUIRED
  /data/v1/companies/search:
    post:
      operationId: SearchInterface_searchCompany
      description: Returns a list of Companies from ZoomInfo's data that meet the specified search criteria.
      parameters:
        - name: page[number]
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: page[size]
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: sort
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request completed successfully and the requested data was returned
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CompanySearchResponse'
        '400':
          description: The base model for all error responses to be used when specifying the response of an operation.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZoomInfo.Core.Foundations.ErrorResponseModel'
        '404':
          description: The base model for all error responses to be used when specifying the response of an operation.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZoomInfo.Core.Foundations.ErrorResponseModel'
      tags:
        - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySearchRequest'
      security:
        - OAuth2Auth:
            - api:search:company
      x-api-roles:
        - fea:zia
        - fea:api
      x-api-role-requirement: ANY_REQUIRED
  /data/v1/contacts/enrich:
    post:
      operationId: EnrichInterface_enrichContact
      description: Returns a list of Contacts from ZoomInfo's data that meet the specified enrich criteria.
      parameters: []
      responses:
        '200':
          description: The request completed successfully and the requested data was returned
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ContactEnrichResponse'
        '400':
          description: The base model for all error responses to be used when specifying the response of an operation.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZoomInfo.Core.Foundations.ErrorResponseModel'
        '404':
          description: The base model for all error responses to be used when specifying the response of an operation.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZoomInfo.Core.Foundations.ErrorResponseModel'
      tags:
        - enrich
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactEnrichRequest'
      security:
        - OAuth2Auth:
            - api:enrich:contact
      x-api-roles:
        - fea:zia
        - fea:api
      x-api-role-requirement: ANY_REQUIRED
  /data/v1/contacts/search:
    post:
      operationId: SearchInterface_searchContact
      description: Returns a list of Contacts from ZoomInfo's data that meet the specified search criteria.
      parameters:
        - name: page[number]
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: page[size]
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: sort
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request completed successfully and the requested data was returned
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ContactSearchResponse'
        '400':
          description: The base model for all error responses to be used when specifying the response of an operation.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZoomInfo.Core.Foundations.ErrorResponseModel'
        '404':
          description: The base model for all error responses to be used when specifying the response of an operation.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZoomInfo.Core.Foundations.ErrorResponseModel'
      tags:
        - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSearchRequest'
      security:
        - OAuth2Auth:
            - api:search:contact
      x-api-roles:
        - fea:zia
        - fea:api
      x-api-role-requirement: ANY_REQUIRED
security:
  - OAuth2Auth: []
components:
  schemas:
    AttributeMeta:
      type: object
      required:
        - matchStatus
        - matchInsight
        - input
      properties:
        matchStatus:
          type: string
        matchInsight:
          $ref: '#/components/schemas/MatchInsights'
        input:
          anyOf:
            - $ref: '#/components/schemas/ContactEnrichRequestCriteria'
            - $ref: '#/components/schemas/CompanyEnrichRequestCriteria'
    CommonEnrichRequestAttributes:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
          description: Unique ZoomInfo identifier for a company.
        companyName:
          type: string
          description: Company name.
    CommonEnrichResponseAttributes:
      type: object
      properties:
        socialMediaUrls:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              url:
                type: string
              followerCount:
                type: string
            required:
              - type
              - url
          description: Social media URLs for the company (e.g., Facebook, Twitter, LinkedIn and so on).
        primaryIndustry:
          type: array
          items:
            type: string
          description: Top-level industry for a company.
        primaryIndustryCode:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: Top-level industry for a company along with its code.
        primarySubIndustryCode:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: Top-level sub-industry for a company along with its code.
        industries:
          type: array
          items:
            type: string
          description: The industry grouping for the company. A company can have multiple industries.
        industryCodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: The industry grouping for the company along with it's codes. A company can have multiple industries.
        website:
          type: string
          description: URL to the company website in http://www.example.com format.
        type:
          type: string
          description: Company type (private, public, npo, education, government, other).
        ticker:
          type: string
          description: Company public stock exchange ticker.
        name:
          type: string
          description: Company name.
        descriptionList:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
            required:
              - description
          description: List of descriptions associated with the company.
        phone:
          type: string
          description: Phone number of the company's primary address.
        fax:
          type: string
          description: Fax number of the company's primary address.
        street:
          type: string
          description: Street of the company's primary address.
        city:
          type: string
          description: City of the company's primary address.
        state:
          type: string
          description: State or province of the company's primary address.
        zipCode:
          type: string
          description: Zip Code or Postal Code of the company's primary address.
        country:
          type: string
          description: Country of the company's primary address.
        continent:
          type: string
          description: Continent of the company's primary address.
        logo:
          type: string
          description: The URL which can be used to retrieve the logo for the company.
        employeeCount:
          type: integer
          format: int32
          description: Approximate number of people employed by the company.
        sicCodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: The Standard Industrial Classification is a system for classifying industries by a four-digit code.
        naicsCodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: The North American Industry Classification System (NAICS) is the standard used by Federal statistical agencies in classifying business establishments for the purpose of collecting, analyzing, and publishing statistical data related to the U.S. business economy.
        employeeRange:
          type: string
          description: Employee range for a company.
        employeeGrowth:
          allOf:
            - $ref: '#/components/schemas/EmployeeGrowth'
          description: Employee growth of the company in the past two years. A one- and two-year growth percentage is provided as well as a quarter-by-quarter breakdown of total employee count.
        revenueRange:
          type: string
          description: Revenue range for a company.
    CommonSearchRequestAttributes:
      type: object
      properties:
        companyTicker:
          type: array
          items:
            type: string
          description: Company stock ticker symbol.
        companyDescription:
          type: string
          description: Search for companies based on description.  Accepts a space-separated list of individual words.
        companyType:
          type: string
          description: 'Company type (private, public, etc.). Accepts a comma delimited string of types listed in the endpoint: /lookup/companytype.'
        address:
          type: string
          description: Company address.
        street:
          type: string
          description: Company street.
        state:
          type: string
          description: Company state.
        zipCode:
          type: string
          description: Zip Code of the company's primary address.
        country:
          type: string
          description: Company country.
        continent:
          type: string
          description: Company continent.
        parentId:
          type: string
          description: ZoomInfo Company ID for parent company.
        zipCodeRadiusMiles:
          type: integer
          format: int16
          description: Used in conjunction with zipCode, designates a geographical radius (in miles) from the zipCode provided. Supported values are [10, 25, 50, 100, 250]
        hashTagString:
          type: string
          description: Hash tags for a company. Can include a comma-separated list.
        techAttributeTagList:
          type: string
          description: Specify technology product tags.
        primaryIndustriesOnly:
          type: boolean
          description: Used in conjunction with the industryCodes input parameter. When set to true, any result returned must have one of the specified industries as a primary industry. If no industries are specified, then this parameter will be ignored. Default is false.
        subUnitTypes:
          type: string
          description: 'Company sub types (e.g., division, subsidiary) from the endpoint: /lookup/subunittypes. Use this in conjunction with parentId or ultimateParentId.'
        industryCodes:
          type: string
          description: Top-level industry that the contact works in. A contact can have multiple top level industries. Tags are based on the contact's current company. Can include a comma-separated list.
        industryKeywords:
          type: string
          description: Industry keywords associated with a company. Can include either 'AND' or 'OR' operators. For example, 'software AND security' or 'software OR security'.
        sicCodes:
          type: string
          description: 'Four-digit numerical codes assigned by the U.S. government to business establishments to identify the primary business of the establishment. Accepts a comma-separated list of values from the endpoint: /lookup/siccode.'
        naicsCodes:
          type: string
          description: 'Four-digit numerical codes assigned by the U.S. government to business establishments to identify the primary business of the establishment. Accepts a comma-separated list of values from the endpoint: /lookup/naicscode.'
        revenue:
          type: string
          description: 'Annual revenue range in U.S. dollars. Accepts a comma-separated list of values from the endpoint: /lookup/revenuerange. Alternatively, for more granular ranges, you can use the revenueMin and revenueMax parameters.'
        revenueMin:
          type: integer
          format: int32
          description: Minimum annual revenue for a company in U.S. dollars (expressed in thousands). Use with revenueMax to set a range. Alternatively, you can use the revenue parameter to search for pre-defined ranges.
        revenueMax:
          type: integer
          format: int32
          description: Maximum annual revenue for a company in U.S. dollars (expressed in thousands). Use with revenueMin to set a range. Alternatively, you can use the revenue parameter to search for pre-defined ranges.
        employeeRangeMin:
          type: string
          description: Minimum employee count for a company. Use with employeeRangeMax to set a range. Alternatively, you can use the employeeCount parameter to search for pre-defined ranges.
        employeeRangeMax:
          type: string
          description: Maximum employee count for a company. Use with employeeRangeMin to set a range. Alternatively, you can use the employeeCount parameter to search for pre-defined ranges.
        employeeCount:
          type: string
          description: 'Employee count range. Accepts a comma-separated list of values from the endpoint: /lookup/employeecount. Alternatively, for more granular ranges, you can use the employeeRangeMin and employeeRangeMax parameters.'
        companyRanking:
          type: string
          description: 'Company ranking (e.g., Fortune 500).  Accepts a comma separated list of IDs from the endpoint: /lookup/companyranking.'
        metroRegion:
          type: string
          description: 'Company metro area. Accepts a comma-separated list of U.S. and Canada metro areas from the endpoint: /lookup/metroarea.'
        locationSearchType:
          type: string
          description: Location type (PersonOrHQ, PersonAndHQ, Person, HQ, PersonThenHQ).
        fundingAmountMin:
          type: integer
          format: int32
          description: Minimum funding amount in thousands (e.g., 1 = 1000, 500 = 500,000). If fundingAmountMin is used without fundingAmountMax, the result will be the amount specified or greater.
        fundingAmountMax:
          type: integer
          format: int32
          description: Maximum funding amount in thousands (e.g., 1 = 1000, 500 = 500,000). If fundingAmountMax is used without fundingAmountMin, the result will be the amount specified or less.
        fundingStartDate:
          type: string
          format: date
          description: Start date of the funding in YYYY-MM-DD format. If fundingStartDate and fundingEndDate are both specified, they will be used as a range. Start date after end date returns an error. If start date and end date are the same, will return results for exact date.
        fundingEndDate:
          type: string
          format: date
          description: End date of the funding in YYYY-MM-DD format. If fundingStartDate and fundingEndDate are both specified, they will be used as a range. Start date after end date returns an error. If start date and end date are the same, will return results for exact date.
        zoominfoContactsMin:
          type: string
          description: Minimum number of ZoomInfo contacts associated with company.
        zoominfoContactsMax:
          type: string
          description: Maximum number of ZoomInfo contacts associated with company.
        excludedRegions:
          type: string
          description: 'Exclude a company state or metro area. Accepts a comma-separated list of U.S. and Canada states and metro areas from the endpoints: /lookup/state and /lookup/metroarea.'
        companyStructureIncludedSubUnitTypes:
          type: string
          description: Company hierarchical structure.
        oneYearEmployeeGrowthRateMin:
          type: string
          description: Minimum one year employee growth rate for a company. Use with oneYearEmployeeGrowthRateMax to set a range.
        oneYearEmployeeGrowthRateMax:
          type: string
          description: Maximum one year employee growth rate for a company. Use with oneYearEmployeeGrowthRateMin to set a range.
        twoYearEmployeeGrowthRateMin:
          type: string
          description: Minimum two year employee growth rate for a company. Use with twoYearEmployeeGrowthRateMax to set a range.
        twoYearEmployeeGrowthRateMax:
          type: string
          description: Maximum two year employee growth rate for a company. Use with twoYearEmployeeGrowthRateMin to set a range.
        engagementStartDate:
          type: string
          format: date
          description: Engagement start date in YYYY-MM-DD format.
        engagementEndDate:
          type: string
          format: date
          description: Engagement end date in YYYY-MM-DD format. EngagementStartDate is required.
        engagementType:
          type: array
          items:
            type: string
          description: List of engagement types to search for. Accepted values are a list of 'email', 'phone', 'online meeting'.
        companyId:
          type: string
          description: ZoomInfo unique identifier for the company. Will accept a comma-separated list.
        companyName:
          type: string
          description: Company name.
        companyWebsite:
          type: string
          description: Company domain. Accepts a comma-separated list.
        ultimateParentId:
          type: string
          description: ZoomInfo Company ID for ultimate parent company.
    Company:
      type: object
      required:
        - companyId
        - companyName
        - companyPhone
        - companyWebsite
      properties:
        companyId:
          type: integer
          format: int64
        companyName:
          type: string
        companyPhone:
          type: string
        companyWebsite:
          type: string
    CompanyEnrichRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CompanyEnrichRequestResource'
      description: |-
        A model representing the top-level JSON:API document.

        For more information on the top-level document, see the JSON:API specification
        https://jsonapi.org/format/#document-top-level
    CompanyEnrichRequestAttributes:
      type: object
      required:
        - outputFields
        - requiredFields
        - matchCompanyInput
      properties:
        outputFields:
          type: array
          items:
            type: string
        requiredFields:
          type: array
          items:
            type: string
        matchCompanyInput:
          type: array
          items:
            $ref: '#/components/schemas/CompanyEnrichRequestCriteria'
    CompanyEnrichRequestCriteria:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
          description: Unique ZoomInfo identifier for a company.
        companyName:
          type: string
          description: Company name.
        companyWebsite:
          type: string
          description: Company website URL in http://www.example.com format.
        companyTicker:
          type: array
          items:
            type: string
          description: Company stock ticker symbol.
        companyPhone:
          type: string
          description: Phone number of the company headquarters.
        companyFax:
          type: string
          description: Fax number of the company headquarters.
        companyStreet:
          type: string
          description: Street address for the company's primary address.
        companyCity:
          type: string
          description: City for the company's primary address.
        companyState:
          type: string
          description: Company state (U.S.) or province (Canada). You can use free text state or province names (e.g., 'new hampshire'), the two-letter common abbreviation for a U.S. state (e.g., 'nh'), or values provided in the State lookup endpoint.
        companyZipCode:
          type: string
          description: Zip code or postal code for the company's primary address.
        companyCountry:
          type: string
          description: Country for the company's primary address. You can use free text or see the Country lookup endpoint for values.
        ipAddress:
          type: string
          description: IP address associated with the company.
    CompanyEnrichRequestResource:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          readOnly: true
        type:
          type: string
          enum:
            - CompanyEnrichRequest
        attributes:
          $ref: '#/components/schemas/CompanyEnrichRequestAttributes'
      description: |-
        A model representing a JSON:API resource object.

        For more information about resource objects, see the JSON:API specification for
        resource objects https://jsonapi.org/format/#document-resource-objects
    CompanyEnrichResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyEnrichResponseResource'
      description: |-
        A model representing the top-level JSON:API document.

        For more information on the top-level document, see the JSON:API specification
        https://jsonapi.org/format/#document-top-level
    CompanyEnrichResponseAttributes:
      type: object
      properties:
        socialMediaUrls:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              url:
                type: string
              followerCount:
                type: string
            required:
              - type
              - url
          description: Social media URLs for the company (e.g., Facebook, Twitter, LinkedIn and so on).
        primaryIndustry:
          type: array
          items:
            type: string
          description: Top-level industry for a company.
        primaryIndustryCode:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: Top-level industry for a company along with its code.
        primarySubIndustryCode:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: Top-level sub-industry for a company along with its code.
        industries:
          type: array
          items:
            type: string
          description: The industry grouping for the company. A company can have multiple industries.
        industryCodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: The industry grouping for the company along with it's codes. A company can have multiple industries.
        website:
          type: string
          description: URL to the company website in http://www.example.com format.
        type:
          type: string
          description: Company type (private, public, npo, education, government, other).
        ticker:
          type: string
          description: Company public stock exchange ticker.
        name:
          type: string
          description: Company name.
        descriptionList:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
            required:
              - description
          description: List of descriptions associated with the company.
        phone:
          type: string
          description: Phone number of the company's primary address.
        fax:
          type: string
          description: Fax number of the company's primary address.
        street:
          type: string
          description: Street of the company's primary address.
        city:
          type: string
          description: City of the company's primary address.
        state:
          type: string
          description: State or province of the company's primary address.
        zipCode:
          type: string
          description: Zip Code or Postal Code of the company's primary address.
        country:
          type: string
          description: Country of the company's primary address.
        continent:
          type: string
          description: Continent of the company's primary address.
        logo:
          type: string
          description: The URL which can be used to retrieve the logo for the company.
        employeeCount:
          type: integer
          format: int32
          description: Approximate number of people employed by the company.
        sicCodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: The Standard Industrial Classification is a system for classifying industries by a four-digit code.
        naicsCodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
          description: The North American Industry Classification System (NAICS) is the standard used by Federal statistical agencies in classifying business establishments for the purpose of collecting, analyzing, and publishing statistical data related to the U.S. business economy.
        employeeRange:
          type: string
          description: Employee range for a company.
        employeeGrowth:
          allOf:
            - $ref: '#/components/schemas/EmployeeGrowth'
          description: Employee growth of the company in the past two years. A one- and two-year growth percentage is provided as well as a quarter-by-quarter breakdown of total employee count.
        revenueRange:
          type: string
          description: Revenue range for a company.
        domainList:
          type: array
          items:
            type: string
          description: List of domains associated with a company.
        revenue:
          type: integer
          format: int64
          description: Approximate yearly revenue for the company in 1000's. For example, a $100M company is expressed as 100000.
        numberOfContactsInZoomInfo:
          type: integer
          format: int32
          description: Number of ZoomInfo contacts associated with company.
        companyStatus:
          type: string
          description: Company status.
        companyStatusDate:
          type: string
          format: date-time
          description: Date of last company status update.
        competitors:
          type: array
          items:
            $ref: '#/components/schemas/Competitor'
          description: List of competitors.
        ultimateParentId:
          type: integer
          format: int64
          description: Unique ZoomInfo identifier for parent company (if exists).
        ultimateParentName:
          type: string
          description: Company name for ultimate parent company (if exists).
        ultimateParentRevenue:
          type: integer
          format: int32
          description: Approximate yearly revenue for the ultimate parent company.
        ultimateParentEmployees:
          type: integer
          format: int32
          description: Approximate number of people employed by the ultimate parent company.
        subUnitCodes:
          type: array
          items:
            type: string
